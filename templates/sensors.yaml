- sensor:
    - name: "Golden Hour Active"
      state: >
        {% set elevation = state_attr('sun.sun', 'elevation') | float(999) %}
        {% set rising = state_attr('sun.sun', 'rising') %}
        {{ not rising and -4 <= elevation <= 6 }}
      icon: mdi:weather-sunset
      attributes:
        elevation: "{{ state_attr('sun.sun', 'elevation') }}"
        rising: "{{ state_attr('sun.sun', 'rising') }}"

    - name: "Blue Hour Active"
      state: >
        {% set elevation = state_attr('sun.sun', 'elevation') | float(999) %}
        {% set rising = state_attr('sun.sun', 'rising') %}
        {{ not rising and -6 <= elevation < -4 }}
      icon: mdi:weather-night
      attributes:
        elevation: "{{ state_attr('sun.sun', 'elevation') }}"
        rising: "{{ state_attr('sun.sun', 'rising') }}"

    - name: "Sun Rising"
      state: "{{ state_attr('sun.sun', 'rising') }}"
      icon: mdi:weather-sunset-up
      attributes:
        elevation: "{{ state_attr('sun.sun', 'elevation') }}"

    # Individual device tracker sensors
    - name: "Pixel 10 on 24G"
      state: >
        {{ states('device_tracker.3e_75_50_39_ba_5a') }}

    - name: "Pixel 10 on 5G"
      state: >
        {{ states('device_tracker.da_86_2b_9a_cd_1c') }}

    - name: "Pixel 10 on 6G"
      state: >
        {{ states('device_tracker.3e_32_7f_b5_ca_8f') }}

    # GPS / mobile-app / geocoded presence.
    - name: "Caleb GPS Presence"
      state: >
        {% set current_address = states('sensor.pixel_10_pro_geocoded_location') | lower | replace(' drive,', ' dr,') | replace(', usa', '') %}
        {% set home_address = states('input_text.home_geocoded_address') | lower | replace(' drive,', ' dr,') | replace(', usa', '') %}
        {% set geocoded_home = home_address not in ['unknown', 'unavailable', 'none', ''] and current_address == home_address %}
        {% if is_state('person.caleb', 'home') or
           is_state('device_tracker.pixel_10_pro', 'home') or
           geocoded_home %}
          home
        {% else %}
          away
        {% endif %}
      attributes:
        person_caleb: "{{ states('person.caleb') }}"
        pixel_10_pro_tracker: "{{ states('device_tracker.pixel_10_pro') }}"
        geocoded_location_available: >
          {{ states('sensor.pixel_10_pro_geocoded_location') not in ['unknown', 'unavailable', 'none', ''] }}
        geocoded_home_match: >
          {% set current_address = states('sensor.pixel_10_pro_geocoded_location') | lower | replace(' drive,', ' dr,') | replace(', usa', '') %}
          {% set home_address = states('input_text.home_geocoded_address') | lower | replace(' drive,', ' dr,') | replace(', usa', '') %}
          {{ home_address not in ['unknown', 'unavailable', 'none', ''] and current_address == home_address }}

    # Companion app Wi-Fi SSID presence across the primary home networks.
    - name: "Caleb Companion WiFi Presence"
      state: >
        {% set home_ssids = ['Vefari', 'Vefari-5G', 'Vefari-6G'] %}
        {% if states('sensor.pixel_10_pro_wi_fi_connection') in home_ssids %}
          home
        {% else %}
          away
        {% endif %}
      attributes:
        wifi_connection: "{{ states('sensor.pixel_10_pro_wi_fi_connection') }}"

    # Ecobee presence sensor using mode, occupancy, and motion.
    - name: "Ecobee Presence"
      state: >
        {% set mode = states('select.downstairs_current_mode') %}
        {% set occupied = is_state('binary_sensor.downstairs_occupancy', 'on') or
           is_state('binary_sensor.upstairs_occupancy', 'on') %}
        {% set motion = is_state('binary_sensor.downstairs_motion', 'on') or
           is_state('binary_sensor.upstairs_motion', 'on') %}
        {% if mode == 'home' or occupied or motion %}
          home
        {% else %}
          away
        {% endif %}
      attributes:
        downstairs_mode: "{{ states('select.downstairs_current_mode') }}"
        downstairs_occupancy: "{{ states('binary_sensor.downstairs_occupancy') }}"
        upstairs_occupancy: "{{ states('binary_sensor.upstairs_occupancy') }}"
        downstairs_motion: "{{ states('binary_sensor.downstairs_motion') }}"
        upstairs_motion: "{{ states('binary_sensor.upstairs_motion') }}"

    # Combined presence sensor: home if any available mechanism says home.
    - name: "Caleb Presence"
      state: >
        {% if is_state('sensor.caleb_gps_presence', 'home') or
           is_state('sensor.caleb_wifi_presence', 'home') or
           is_state('sensor.caleb_companion_wifi_presence', 'home') or
           is_state('sensor.ecobee_presence', 'home') %}
          home
        {% else %}
          away
        {% endif %}
      attributes:
        gps_presence: "{{ states('sensor.caleb_gps_presence') }}"
        router_wifi_presence: "{{ states('sensor.caleb_wifi_presence') }}"
        companion_wifi_presence: "{{ states('sensor.caleb_companion_wifi_presence') }}"
        ecobee_presence: "{{ states('sensor.ecobee_presence') }}"
