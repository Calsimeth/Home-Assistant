- alias: "Turn on lights at 10 PM when home"
  description: "Turns on lights at 10:00 PM if Caleb is home"
  trigger:
    - platform: time
      at: "22:00:00"
  condition:
    - condition: state
      entity_id: binary_sensor.caleb_presence
      state: "home"
  action:
    - service: light.turn_on
      target:
        entity_id: light.nightstand_lamp_2  # Replace with actual entity ID
      # Optional: Different settings for nighttime
      # data:
      #   brightness_pct: 30
      #   color_temp: 2200  # Warmer light for evening
  mode: single