- alias: "Morning wake-up lights when unplugging phone"
  description: "Turn on lights when I unplug phone between 6–8 AM, but only if I'm home"
  trigger:
    - platform: state
      entity_id: binary_sensor.pixel_7_pro_is_charging
      from: 'on'
      to: 'off'

  condition:
    - condition: time
      after: '06:00:00'
      before: '09:00:00'
    - condition: state
      entity_id: binary_sensor.caleb_presence  # replace with your actual person entity
      state: 'home'

  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.lava_lamp
          - light.giant_lava_lamp
    - service: switch.turn_off
      target:
        entity_id:
          - switch.nightstand_fan
  mode: single
