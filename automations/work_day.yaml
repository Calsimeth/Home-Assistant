- alias: "Turn on lights on work days"
  description: "Turns on lights at 10:00 AM if Caleb is home on a work day"
  trigger:
    - platform: time
      at: "10:00:00"
  condition:
    - condition: state
      entity_id: binary_sensor.caleb_presence
      state: "home"
    - condition: state
      entity_id: binary_sensor.pixel_7_pro_work_profile
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.entry_lamp  # Replace with actual entity ID
      # Optional: Different settings for nighttime
      # data:
      #   brightness_pct: 30
      #   color_temp: 2200  # Warmer light for evening
  mode: single